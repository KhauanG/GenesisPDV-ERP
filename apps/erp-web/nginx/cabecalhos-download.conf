# Cabeçalhos do download.<domínio> (incluído em cada `location` do server do download): os de toda resposta
# (cabecalhos.conf) e uma CSP fechada, que a página aguenta porque não tem nada inline (estilo.css e pagina.js são
# arquivos próprios) e só fala com a própria origem (o fetch do /pdv/atual.json).
include /etc/nginx/genesis-cabecalhos.conf;
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
