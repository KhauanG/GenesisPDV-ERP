# ERP web (SPA do Vite) e página de download do PDV. O TLS e os domínios ficam no Traefik da VPS; aqui só HTTP
# interno na porta 8080 (usuário sem root). As rotas /api e /saude do domínio do ERP vão direto do Traefik para a API.
server_tokens off;
charset utf-8;
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json image/svg+xml text/plain;

# ERP: qualquer host que não seja o de download.
server {
    listen 8080 default_server;
    root /usr/share/nginx/html;

    # Healthcheck do container (não passa pelo Traefik com outro significado: só diz que o nginx responde).
    location = /saude-web {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Arquivos com hash no nome (Vite): cache longo.
    location /assets/ {
        include /etc/nginx/genesis-cabecalhos.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Rotas do React Router caem no index.html, que nunca fica em cache (sempre a versão nova depois do deploy).
    location / {
        include /etc/nginx/genesis-cabecalhos.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}

# download.<domínio>: a página (index.html, estilo.css e pagina.js, de nginx/download/ na imagem) e, em /pdv/, o
# instalador do PDV: a pasta do host /opt/genesis/download/pdv montada só leitura em /srv/download/pdv (o instalador
# grande não entra na imagem). Quem grava lá é o `implantar.sh pdv publicar`, chamado pela Implantação com os
# arquivos do último GitHub Release do PDV (README de infra/producao › Página de download do PDV). Sem nada publicado,
# /pdv/atual.json responde 404 e a página diz que o instalador ainda não foi publicado.
server {
    listen 8080;
    server_name ~^download\.;
    root /srv/download;
    autoindex off;

    location / {
        include /etc/nginx/genesis-cabecalhos-download.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    # Versão publicada (versao, arquivo, tamanho_bytes, sha256, publicado_em), lida pela pagina.js.
    location = /pdv/atual.json {
        include /etc/nginx/genesis-cabecalhos-download.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # O instalador (sempre baixado, nunca aberto no navegador; aceita Range, para retomar um download que caiu) e o
    # .sha256 dele em texto. O nome leva a versão; no-cache (revalida pelo ETag) cobre o release refeito com
    # "substituir" no mesmo nome.
    location ~ ^/pdv/(GenesisPDV-Setup-[0-9]+\.[0-9]+\.[0-9]+\.exe)$ {
        include /etc/nginx/genesis-cabecalhos-download.conf;
        add_header Cache-Control "no-cache" always;
        add_header Content-Disposition 'attachment; filename="$1"' always;
        types { }
        default_type application/octet-stream;
        try_files $uri =404;
    }

    location ~ ^/pdv/GenesisPDV-Setup-[0-9]+\.[0-9]+\.[0-9]+\.exe\.sha256$ {
        include /etc/nginx/genesis-cabecalhos-download.conf;
        add_header Cache-Control "no-cache" always;
        types { }
        default_type text/plain;
        try_files $uri =404;
    }

    # Qualquer outro nome em /pdv (a própria pasta, temporários, arquivos estranhos): 404, sem o redirect de pasta.
    location /pdv {
        include /etc/nginx/genesis-cabecalhos-download.conf;
        return 404;
    }
}
