# Cabeçalhos de segurança de toda resposta do ERP e do download (incluído em cada `location`, porque um `add_header`
# dentro do location descarta os herdados do server). A CSP do ERP fica para depois de conferida com o ERP rodando
# (README de infra/producao › Pendências); a do download, que não tem nada inline, está em cabecalhos-download.conf.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
